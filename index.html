<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EA Link Based Test UI</title>
    <style>
      :root {
        --ink: #1f2937;
        --muted: #667085;
        --subtle: #98a2b3;
        --line: #e4e7ec;
        --surface: #ffffff;
        --page: #f7f8fa;
        --navy: #1d2d50;
        --navy-2: #243a66;
        --blue: #2563eb;
        --blue-soft: #eef4ff;
        --orange: #f28c28;
        --orange-soft: #fff6ec;
        --green: #17824b;
        --green-soft: #eaf8f0;
        --red: #c63636;
        --red-soft: #fff1f1;
        --purple: #6846c7;
        --shadow: 0 16px 40px rgba(28, 41, 72, 0.12);
        --shadow-small: 0 4px 16px rgba(28, 41, 72, 0.1);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--page);
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--page); color: var(--ink); }
      button, input { font: inherit; }
      button { cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 3px solid rgba(37, 99, 235, 0.26); outline-offset: 2px; }

      .app-shell { min-height: 100vh; display: flex; }
      .sidebar { width: 248px; background: var(--navy); color: #f7f9ff; padding: 20px 14px; display: flex; flex-direction: column; flex-shrink: 0; }
      .brand { display: flex; align-items: center; gap: 10px; padding: 2px 12px 22px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #f9d444; color: var(--navy); font-weight: 800; }
      .brand-title { font-weight: 750; letter-spacing: -0.02em; }
      .brand-subtitle { font-size: 11px; color: #b9c8e7; margin-top: 2px; }
      .product-switcher { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.08); border-radius: 10px; padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; margin: 0 2px 20px; }
      .product-switcher strong { display: block; font-size: 13px; }
      .product-switcher span { display: block; color: #b9c8e7; font-size: 11px; margin-top: 2px; }
      .chevron { color: #cbd6ef; font-size: 16px; }
      .nav-label { color: #91a5ce; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; padding: 0 12px 8px; }
      .nav-item { border: 0; color: #dbe5fb; width: 100%; display: flex; align-items: center; gap: 10px; background: transparent; border-radius: 8px; padding: 10px 12px; text-align: left; font-size: 13px; margin-bottom: 2px; }
      .nav-item:hover, .nav-item.active { background: rgba(255,255,255,.13); color: white; }
      .nav-icon { width: 18px; text-align: center; opacity: .9; }
      .nav-item.nested { padding-left: 40px; font-size: 12px; }
      .nav-item.nested.active { background: #33538d; box-shadow: inset 3px 0 #f9d444; }
      .sidebar-foot { margin-top: auto; border-top: 1px solid rgba(255,255,255,.13); padding: 16px 12px 0; color: #bdc9e5; font-size: 11px; line-height: 1.5; }
      .sidebar-foot b { color: white; display: block; font-size: 12px; margin-bottom: 3px; }

      .main { flex: 1; min-width: 0; }
      .topbar { height: 62px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 30px; }
      .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
      .crumbs b { color: var(--ink); font-weight: 650; }
      .top-actions { display: flex; align-items: center; gap: 14px; }
      .prototype-chip { font-size: 11px; color: var(--purple); background: #f3efff; border: 1px solid #ded4ff; border-radius: 999px; padding: 5px 9px; font-weight: 700; }
      .avatar { width: 32px; height: 32px; border-radius: 50%; background: #dae7ff; color: var(--blue); display: grid; place-items: center; font-weight: 800; font-size: 12px; }
      .page { padding: 28px 30px 46px; max-width: 1450px; margin: 0 auto; }
      .design-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
      .design-tab { border: 1px solid var(--line); background: white; color: var(--muted); border-radius: 8px; padding: 8px 12px; font-size: 12px; font-weight: 700; }
      .design-tab:hover, .design-tab.active { color: var(--blue); border-color: #b9cdfc; background: var(--blue-soft); }
      .title-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
      .title-row h1 { font-size: 25px; line-height: 1.2; margin: 0; letter-spacing: -0.025em; }
      .title-row p { margin: 7px 0 0; color: var(--muted); font-size: 13px; max-width: 730px; }
      .title-actions { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
      .btn { border: 1px solid var(--line); color: var(--ink); background: white; border-radius: 8px; padding: 9px 13px; font-size: 12px; font-weight: 750; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
      .btn:hover { border-color: #a8b8d9; background: #fbfcff; }
      .btn.primary { background: var(--blue); border-color: var(--blue); color: white; }
      .btn.primary:hover { background: #1d4ed8; }
      .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
      .btn.small { padding: 7px 9px; font-size: 11px; }
      .btn.danger { color: var(--red); }
      .icon-btn { width: 30px; height: 30px; padding: 0; justify-content: center; }
      .back-btn { border: 0; padding: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; margin-bottom: 12px; }
      .back-btn:hover { color: var(--blue); }

      .filter-bar { background: white; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 15px; }
      .field { min-width: 145px; flex: 1; }
      .field label { display: block; color: var(--muted); font-size: 10px; font-weight: 800; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .06em; }
      .field input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; color: var(--ink); background: white; font-size: 12px; }
      .field input::placeholder { color: #a0a9b8; }
      .select-like { border: 1px solid var(--line); border-radius: 7px; padding: 9px 10px; color: var(--ink); background: white; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
      .table-wrap { background: white; border: 1px solid var(--line); border-radius: 10px; overflow: visible; }
      .table-scroll { overflow-x: auto; }
      table { border-collapse: collapse; width: 100%; min-width: 860px; }
      th { background: #f8fafc; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 800; letter-spacing: .05em; text-align: left; text-transform: uppercase; padding: 12px 15px; white-space: nowrap; }
      td { border-bottom: 1px solid #eef0f4; padding: 15px; font-size: 12px; vertical-align: middle; }
      tbody tr:last-child td { border-bottom: 0; }
      tbody tr:hover td { background: #fbfcff; }
      .session-title { font-weight: 750; color: var(--ink); }
      .session-sub { color: var(--muted); font-size: 11px; margin-top: 3px; }
      .status { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 5px 8px; font-weight: 800; font-size: 10px; }
      .status.published { color: var(--green); background: var(--green-soft); }
      .status.scheduled { color: #a15d0c; background: #fff4d8; }
      .status.draft { color: var(--muted); background: #f0f2f5; }
      .status-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .action-cell { position: relative; display: flex; align-items: center; gap: 7px; }
      .menu { position: absolute; top: 39px; right: 0; z-index: 20; min-width: 170px; padding: 6px; background: white; border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow-small); }
      .menu button { width: 100%; border: 0; background: transparent; padding: 9px 10px; border-radius: 6px; text-align: left; color: var(--ink); font-size: 12px; display: flex; gap: 8px; align-items: center; }
      .menu button:hover { background: var(--blue-soft); color: var(--blue); }
      .menu button.new { color: var(--orange); font-weight: 800; }
      .new-outline { outline: 2px dashed var(--orange); outline-offset: 4px; }
      .annotation { color: #99601b; background: var(--orange-soft); border: 1px dashed #f0ac5c; padding: 8px 10px; border-radius: 7px; font-size: 11px; line-height: 1.45; }
      .annotation b { color: #8a4a06; }
      .table-footer { padding: 13px 15px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
      .pager { display: flex; gap: 6px; }
      .pager button { border: 1px solid var(--line); background: white; border-radius: 6px; font-size: 11px; padding: 5px 8px; color: var(--muted); }
      .pager button.active { color: var(--blue); border-color: #b9cdfc; background: var(--blue-soft); }

      .meta-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
      .meta-item { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 13px 14px; }
      .meta-label { color: var(--muted); font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
      .meta-value { color: var(--ink); font-size: 13px; font-weight: 750; margin-top: 6px; }
      .safety-banner { display: flex; gap: 11px; align-items: flex-start; background: var(--orange-soft); border: 1px solid #f7c47e; border-radius: 9px; padding: 13px 14px; margin-bottom: 18px; color: #7b4d0d; font-size: 12px; line-height: 1.5; }
      .banner-icon { width: 22px; height: 22px; border-radius: 7px; background: #f6b85d; color: #5a3603; display: grid; place-items: center; font-weight: 900; flex-shrink: 0; }
      .safety-banner b { display: block; color: #6a4107; margin-bottom: 2px; }
      .stat-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
      .stat { background: white; border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; }
      .stat span { color: var(--muted); font-size: 11px; }
      .stat strong { display: block; font-size: 21px; letter-spacing: -.03em; margin-top: 4px; }
      .link-cell { max-width: 360px; }
      .link-code { display: block; color: var(--blue); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; }
      .copy-btn { color: var(--blue); border-color: #b9cdfc; background: var(--blue-soft); }
      .qr-btn { color: var(--purple); border-color: #d9d0fa; background: #f8f5ff; }

      .boundary { border: 1px solid #b8a9ef; background: #fbfaff; border-radius: 12px; padding: 16px; position: relative; }
      .boundary-label { position: absolute; top: -11px; left: 15px; background: var(--purple); color: white; border-radius: 999px; padding: 4px 9px; font-size: 10px; font-weight: 800; letter-spacing: .04em; }
      .student-shell { background: #f6f3ff; border-radius: 10px; border: 1px solid #e3dcff; overflow: hidden; }
      .student-top { background: linear-gradient(115deg, #302079, #5a35a9); color: white; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; gap: 15px; }
      .student-brand { font-weight: 800; font-size: 15px; }
      .student-user { display: flex; align-items: center; gap: 9px; font-size: 11px; color: #e6ddff; }
      .student-avatar { width: 29px; height: 29px; border-radius: 50%; background: #ffc94a; color: #4f2b92; display: grid; place-items: center; font-weight: 900; }
      .student-content { padding: 26px; max-width: 720px; margin: 0 auto; }
      .student-content h2 { margin: 0; font-size: 23px; letter-spacing: -.03em; }
      .student-content p { color: var(--muted); font-size: 12px; margin: 8px 0 20px; }
      .test-card { background: white; border: 1px solid #e3dcff; border-radius: 12px; padding: 18px; box-shadow: 0 8px 22px rgba(52, 31, 125, .08); }
      .test-card-head { display: flex; justify-content: space-between; gap: 15px; align-items: flex-start; }
      .test-card h3 { margin: 0; font-size: 16px; }
      .test-card small { color: var(--muted); display: block; margin-top: 5px; font-size: 11px; }
      .test-badge { color: var(--purple); background: #f1edff; border-radius: 999px; padding: 5px 8px; font-size: 10px; font-weight: 800; white-space: nowrap; }
      .test-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
      .test-info div { background: #fafbff; border-radius: 7px; padding: 9px; }
      .test-info span { display: block; color: var(--muted); font-size: 10px; }
      .test-info b { display: block; margin-top: 3px; font-size: 12px; }
      .student-actions { display: flex; gap: 8px; align-items: center; }
      .student-state-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px; }
      .state-btn { border: 1px solid #d8cdfb; border-radius: 999px; padding: 7px 10px; color: #6c59ae; background: white; font-size: 11px; font-weight: 750; }
      .state-btn.active { background: var(--purple); color: white; border-color: var(--purple); }
      .state-message { margin-top: 15px; border-radius: 8px; padding: 11px 12px; font-size: 11px; line-height: 1.45; }
      .state-message.success { background: var(--green-soft); color: #14633d; }
      .state-message.warning { background: #fff5df; color: #7d4f08; }
      .state-message.error { background: var(--red-soft); color: #9c2a2a; }
      .integration-note { margin-top: 13px; color: #6d5ba5; font-size: 11px; line-height: 1.45; }

      .score-card { background: white; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .score-head { padding: 16px 17px; display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; border-bottom: 1px solid var(--line); }
      .score-head h2 { margin: 0; font-size: 16px; }
      .score-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
      .score-filters { display: flex; gap: 8px; flex-wrap: wrap; }
      .filter-chip { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; font-size: 11px; color: var(--muted); background: #fbfcff; }
      .score-value { font-size: 14px; font-weight: 800; }
      .score-pass { color: var(--green); }
      .score-pending { color: #a15d0c; }
      .source-note { display: inline-flex; align-items: center; gap: 5px; border: 1px solid #cdd9f8; color: var(--blue); background: var(--blue-soft); border-radius: 999px; padding: 4px 7px; font-size: 10px; font-weight: 750; }

      .modal-backdrop { position: fixed; inset: 0; background: rgba(18, 26, 45, .52); display: grid; place-items: center; padding: 18px; z-index: 100; }
      .modal { width: min(720px, 100%); max-height: calc(100vh - 36px); overflow: auto; background: white; border-radius: 14px; box-shadow: var(--shadow); }
      .modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; padding: 17px 19px; border-bottom: 1px solid var(--line); }
      .modal-head h2 { margin: 0; font-size: 16px; }
      .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
      .modal-body { padding: 20px; display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: center; }
      .qr-preview { border: 1px solid var(--line); border-radius: 10px; padding: 15px; text-align: center; background: #fbfcff; }
      .qr-preview svg { width: 190px; height: 190px; margin: 0 auto; display: block; }
      .qr-preview b { display: block; font-size: 11px; margin-top: 10px; }
      .qr-preview span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
      .modal-detail h3 { margin: 0 0 14px; font-size: 17px; }
      .detail-line { display: flex; justify-content: space-between; gap: 15px; border-bottom: 1px solid #eef0f4; padding: 10px 0; font-size: 12px; }
      .detail-line span { color: var(--muted); }
      .detail-line b { text-align: right; }
      .modal-footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
      .toast { position: fixed; right: 22px; bottom: 22px; z-index: 140; background: #162641; color: white; border-radius: 9px; padding: 12px 14px; box-shadow: var(--shadow); max-width: 320px; font-size: 12px; display: flex; gap: 9px; align-items: flex-start; animation: toast-in .18s ease-out; }
      .toast strong { display: block; font-size: 12px; margin-bottom: 2px; }
      .toast span { color: #dce8ff; font-size: 11px; line-height: 1.4; }
      .toast-icon { color: #7ee2a9; font-size: 15px; }
      @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

      @media (max-width: 960px) {
        .sidebar { width: 214px; }
        .page { padding: 24px 20px 40px; }
        .topbar { padding: 0 20px; }
        .meta-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      }
      @media (max-width: 720px) {
        .sidebar { display: none; }
        .topbar { height: 56px; padding: 0 15px; }
        .crumbs span { display: none; }
        .prototype-chip { display: none; }
        .page { padding: 19px 14px 34px; }
        .title-row { flex-direction: column; }
        .title-actions { justify-content: flex-start; }
        .design-tabs { overflow-x: auto; flex-wrap: nowrap; padding-bottom: 3px; }
        .design-tab { flex-shrink: 0; }
        .meta-grid, .stat-row { grid-template-columns: 1fr; }
        .filter-bar { align-items: stretch; }
        .field { min-width: 100%; }
        .table-wrap { border-radius: 8px; }
        .table-footer { align-items: flex-start; gap: 10px; flex-direction: column; }
        .student-content { padding: 18px 14px; }
        .student-top { padding: 14px; }
        .student-user { font-size: 0; }
        .test-info { grid-template-columns: 1fr; }
        .student-actions { flex-direction: column; align-items: stretch; }
        .student-actions .btn { justify-content: center; }
        .modal-body { grid-template-columns: 1fr; }
        .qr-preview { max-width: 250px; margin: 0 auto; width: 100%; }
      }

      /* Preserve the existing Super CMS / English Academy visual language. */
      :root {
        --ink: #1f2937;
        --muted: #667085;
        --line: #d9e3ea;
        --surface: #ffffff;
        --page: #eef5f9;
        --navy: #edf7fb;
        --blue: #1f5da8;
        --blue-soft: #e9f8fc;
        --orange: #e9782d;
        --orange-soft: #fff4ea;
        --green: #5a9d63;
        --green-soft: #e9f6e9;
      }
      body { background: var(--page); }
      .app-shell { background: var(--page); }
      .sidebar { width: 280px; padding: 0; background: #fff; color: var(--ink); display: flex; flex-direction: row; border-right: 1px solid #d8e2e8; }
      .product-rail { width: 70px; flex: 0 0 70px; background: #edf8fb; display: flex; justify-content: center; padding-top: 20px; }
      .ea-logo { width: 48px; height: 48px; border: 2px solid #3c95a9; border-radius: 50%; color: #27768b; display: grid; place-items: center; text-align: center; font-size: 8px; line-height: 1.05; font-weight: 800; letter-spacing: .06em; }
      .product-nav { width: 210px; min-width: 0; padding: 18px 0 0; overflow: hidden; }
      .brand { padding: 6px 14px 22px; }
      .brand-mark, .brand-subtitle { display: none; }
      .brand-title { color: #1f2937; font-size: 14px; font-weight: 750; }
      .product-switcher, .nav-label { display: none; }
      .nav-item { color: #202830; border-radius: 0; padding: 9px 14px; margin: 0; font-size: 13px; gap: 0; background: transparent; }
      .nav-item:hover { background: #f3f7f9; color: #202830; }
      .nav-item.active { background: #e5f8fc; color: #202830; }
      .nav-item.nested { padding-left: 28px; font-size: 13px; }
      .nav-item.nested.active { background: #e5f8fc; box-shadow: none; }
      .nav-icon { display: none; }
      .sidebar-foot { display: none; }
      .nav-section { color: #202830; padding: 9px 14px; font-size: 13px; display: flex; justify-content: space-between; }
      .nav-section.active { background: #e5f8fc; }
      .nav-chevron { font-size: 16px; color: #202830; }
      .main { background: var(--page); }
      .topbar { height: 85px; background: var(--page); border-bottom: 1px solid #d7e1e8; padding: 0 28px; align-items: center; }
      .topbar-left { display: flex; flex-direction: column; gap: 6px; }
      .crumbs { color: #202830; font-size: 12px; gap: 9px; }
      .crumbs b { color: #202830; font-weight: 500; }
      .topbar-title { color: #202830; font-size: 22px; line-height: 1; font-weight: 750; }
      .top-actions { gap: 14px; }
      .prototype-chip { display: none; }
      .user-meta { color: #202830; text-align: right; font-size: 11px; line-height: 1.45; }
      .avatar { width: 40px; height: 40px; background: #9bf248; color: #1f2937; font-size: 12px; }
      .page { padding: 14px 15px 46px; max-width: none; }
      .design-tabs { display: none; }
      .title-row { margin-bottom: 18px; }
      .title-row h1 { font-size: 22px; }
      .title-row p { font-size: 12px; }
      .btn { border-color: #d6e0e7; border-radius: 7px; padding: 8px 14px; font-size: 12px; font-weight: 600; }
      .btn.primary { background: var(--orange); border-color: var(--orange); }
      .filter-bar { background: transparent; border: 0; border-radius: 0; padding: 0; gap: 8px; margin-bottom: 9px; align-items: flex-end; }
      .field { min-width: 180px; flex: 1; }
      .field label { color: #202830; font-size: 12px; font-weight: 500; text-transform: none; letter-spacing: 0; }
      .field input, .select-like { min-height: 36px; border-color: #d6e0e7; border-radius: 6px; background: #fff; font-size: 12px; }
      .select-like { color: #667085; }

        function qrSvg(seed) {
          const size = 25;
          let hash = 0;
          for (let i = 0; i < seed.length; i += 1) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
          const modules = [];
          const isFinder = (x, y, ox, oy) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7;
          const finder = (x, y, ox, oy) => {

          };
          for (let y = 0; y < size; y += 1) {
            for (let x = 0; x < size; x += 1) {
              let on = false;
              if (isFinder(x, y, 0, 0)) on = finder(x, y, 0, 0);
              else if (isFinder(x, y, size - 7, 0)) on = finder(x, y, size - 7, 0);
              else if (isFinder(x, y, 0, size - 7)) on = finder(x, y, 0, size - 7);
              else { hash = (hash * 1664525 + 1013904223) >>> 0; on = (hash % 11) < 5; }

          if (state.modalStudent === null) return '';
          const student = students[state.modalStudent];
          return `<div class="modal-backdrop" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="qr-title"><div class="modal-head"><div><h2 id="qr-title">Download student QR</h2><p>One QR code maps to one student-specific test link.</p></div><button class="btn icon-btn" type="button" data-close-modal aria-label="Close">${icon('close')}</button></div><div class="modal-body"><div class="qr-preview">${qrSvg(student.token)}<b>Unit 2 Progress Test</b><span>${esc(student.name)}</span></div><div class="modal-detail"><h3>${esc(student.name)}</h3><div class="detail-line"><span>Student cohort</span><b>${esc(student.cohort)}</b></div><div class="detail-line"><span>Test name / Exam title</span><b>Unit 2 Progress Test</b></div><div class="annotation" style="margin-top:15px;"><b>Check before download:</b> confirm the student name matches the intended recipient.</div></div></div><div class="modal-footer"><button class="btn primary" type="button" data-download-qr="${state.modalStudent}">${icon('download')} Download PNG</button></div></div></div>`;
        }

        function showToast(title, message) {
          state.toast = { title, message };
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => { state.toast = null; render(); }, 3600);
          render();
        }

        function render() {
          root.innerHTML = shell();
          const view = root.querySelector('#view');
          view.innerHTML = state.screen === 'list' ? renderList() : state.screen === 'link' ? renderLink() : state.screen === 'student' ? renderStudent() : renderScoring();
          const modal = renderModal();
          if (modal) view.insertAdjacentHTML('beforeend', modal);
          if (state.toast) root.insertAdjacentHTML('beforeend', `<div class="toast" role="status" aria-live="polite"><div class="toast-icon">${icon('check')}</div><div><strong>${esc(state.toast.title)}</strong><span>${esc(state.toast.message)}</span></div></div>`);
        }

        async function copyStudent(index) {
          const student = students[index];
          try { await navigator.clipboard.writeText(student.link); } catch (_) { const area = document.createElement('textarea'); area.value = student.link; document.body.appendChild(area); area.select(); document.execCommand('copy'); area.remove(); }
          showToast('Link copied', `${student.name}'s unique test link is ready to share.`);
        }

        function downloadQr(index) {
          const student = students[index];
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const size = 1024;
          canvas.width = size; canvas.height = size;
          ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, size, size);
          const modules = 25; const qrBox = 760; const qrX = (size - qrBox) / 2; const qrY = 72; const quiet = 36; const cell = (qrBox - quiet * 2) / modules;
          let hash = 0; for (let i = 0; i < student.token.length; i += 1) hash = (hash * 31 + student.token.charCodeAt(i)) >>> 0;
          const finder = (x, y, ox, oy) => { const dx = x - ox; const dy = y - oy; return dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4); };
          ctx.fillStyle = '#14213d';
          for (let y = 0; y < modules; y += 1) for (let x = 0; x < modules; x += 1) { let on = false; const finderArea = (ox, oy) => x >= ox && x < ox + 7 && y >= oy && y < oy + 7; if (finderArea(0, 0)) on = finder(x, y, 0, 0); else if (finderArea(modules - 7, 0)) on = finder(x, y, modules - 7, 0); else if (finderArea(0, modules - 7)) on = finder(x, y, 0, modules - 7); else { hash = (hash * 1664525 + 1013904223) >>> 0; on = (hash % 11) < 5; } if (on) ctx.fillRect(qrX + quiet + x * cell, qrY + quiet + y * cell, cell + .5, cell + .5); }
          ctx.fillStyle = '#14213d'; ctx.font = '700 28px Arial'; ctx.textAlign = 'center'; ctx.fillText('Unit 2 Progress Test', size / 2, 900); ctx.fillStyle = '#667085'; ctx.font = '500 24px Arial'; ctx.fillText(student.name, size / 2, 950);
          canvas.toBlob((blob) => { const url = URL.createObjectURL(blob); const link = document.createElement('a'); link.href = url; link.download = `unit-2-progress-test-${student.token}.png`; link.click(); URL.revokeObjectURL(url); showToast('QR downloaded', `PNG prepared for ${student.name}.`); }, 'image/png');
        }

        root.addEventListener('click', (event) => {
          const target = event.target.closest('button');
          if (!target) return;
          if (target.dataset.screen) { state.screen = target.dataset.screen; state.openMenu = null; state.modalStudent = null; render(); return; }
          if (target.dataset.menu) { state.openMenu = state.openMenu === target.dataset.menu ? null : target.dataset.menu; render(); return; }
          if (target.dataset.copy) { copyStudent(Number(target.dataset.copy)); return; }
          if (target.dataset.qr) { state.modalStudent = Number(target.dataset.qr); render(); return; }
          if (target.hasAttribute('data-close-modal')) { state.modalStudent = null; render(); return; }
          if (target.dataset.downloadQr) { downloadQr(Number(target.dataset.downloadQr)); return; }
          if (target.dataset.slmsState) { state.slmsState = target.dataset.slmsState; render(); return; }
        });
        document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && state.modalStudent !== null) { state.modalStudent = null; render(); } });
        render();
      })();
    </script>
  </body>
</html>
